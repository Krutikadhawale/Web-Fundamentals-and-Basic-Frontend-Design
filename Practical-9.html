
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My To-Do List</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center p-5">

    <div class="bg-white/95 backdrop-blur-lg w-full max-w-xl rounded-3xl shadow-2xl p-8">

        <div class="text-center mb-7">

            <div class="text-5xl mb-3">
                📝
            </div>

            <h1 class="text-4xl font-bold text-gray-800">
                My To-Do List
            </h1>

            <p class="text-gray-500 mt-2">
                Organize your day, one task at a time ✨
            </p>

        </div>

        <div class="flex gap-3 mb-6">

            <input
                id="taskInput"
                type="text"
                placeholder="What do you need to do?"
                class="flex-1 border-2 border-gray-200 rounded-xl px-4 py-3 outline-none focus:border-purple-500"
            >

            <button
                onclick="addTask()"
                class="bg-purple-600 text-white px-6 py-3 rounded-xl font-semibold hover:bg-purple-700">
                Add
            </button>

        </div>

        <div class="flex justify-between items-center mb-4">

            <h2 class="text-xl font-bold text-gray-700">
                Today's Tasks
            </h2>

            <span
                id="taskCount"
                class="bg-purple-100 text-purple-700 px-4 py-1 rounded-full font-semibold">
                0 Tasks
            </span>

        </div>

        <div id="taskList" class="space-y-3"></div>

        <p id="emptyMessage" class="text-center text-gray-400 py-8">
            No tasks yet. Add your first task! 🌟
        </p>

    </div>

    <script>

        let count = 0;

        function addTask() {

            let input = document.getElementById("taskInput");
            let task = input.value.trim();

            if (task === "") {
                alert("Please enter a task!");
                return;
            }

            let taskItem = document.createElement("div");

            taskItem.className =
                "flex items-center gap-3 bg-gray-50 border border-gray-200 p-4 rounded-xl shadow-sm";

            taskItem.innerHTML = `
                <button onclick="completeTask(this)"
                    class="w-6 h-6 border-2 border-purple-500 rounded-full">
                </button>

                <span class="flex-1 text-gray-700 font-medium">
                    ${task}
                </span>

                <button onclick="deleteTask(this)"
                    class="bg-red-500 text-white px-3 py-2 rounded-lg hover:bg-red-600">
                    Delete
                </button>
            `;

            document.getElementById("taskList").appendChild(taskItem);

            count++;
            updateCount();

            input.value = "";

            document.getElementById("emptyMessage").classList.add("hidden");
        }

        function completeTask(button) {

            let task = button.nextElementSibling;

            task.classList.toggle("line-through");
            task.classList.toggle("text-gray-400");

            button.classList.toggle("bg-green-500");
        }

        function deleteTask(button) {

            button.parentElement.remove();

            count--;
            updateCount();

            if (count === 0) {
                document.getElementById("emptyMessage").classList.remove("hidden");
            }
        }

        function updateCount() {

            document.getElementById("taskCount").innerText =
                count + (count === 1 ? " Task" : " Tasks");
        }

    </script>

</body>

</html>
