
<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>

    <style>
        body {
            font-family: Arial;
            background-color: #e8f5e9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .form-box {
            background-color: white;
            width: 400px;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 15px gray;
        }

        h2 {
            text-align: center;
            color: #2e7d32;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #aaa;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 11px;
            margin-top: 20px;
            background-color: #2e7d32;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
        }

        button:hover {
            background-color: #1b5e20;
        }

        #message {
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="form-box">

    <h2>Student Registration</h2>

    <form id="registrationForm">

        <label>Name</label>
        <input type="text" id="name" placeholder="Enter your name">

        <label>Email</label>
        <input type="text" id="email" placeholder="Enter your email">

        <label>Password</label>
        <input type="password" id="password" placeholder="Minimum 6 characters">

        <label>Mobile Number</label>
        <input type="text" id="mobile" placeholder="Enter 10 digit number">

        <label>Course</label>
        <select id="course">
            <option value="">Select Course</option>
            <option>B.Tech</option>
            <option>BCA</option>
            <option>BBA</option>
            <option>MCA</option>
        </select>

        <button type="submit">Register</button>

        <p id="message"></p>

    </form>

</div>

<script>

document.getElementById("registrationForm").onsubmit = function(event) {

    event.preventDefault();

    let name = document.getElementById("name").value;
    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;
    let mobile = document.getElementById("mobile").value;
    let course = document.getElementById("course").value;
    let message = document.getElementById("message");

    if (name == "" || email == "" || password == "" || mobile == "" || course == "") {
        message.innerHTML = "Please fill all fields";
        message.style.color = "red";
    }
    else if (!email.includes("@")) {
        message.innerHTML = "Enter a valid email";
        message.style.color = "red";
    }
    else if (password.length < 6) {
        message.innerHTML = "Password must be at least 6 characters";
        message.style.color = "red";
    }
    else if (mobile.length != 10 || isNaN(mobile)) {
        message.innerHTML = "Enter a valid 10 digit mobile number";
        message.style.color = "red";
    }
    else {
        message.innerHTML = "Registration Successful!";
        message.style.color = "green";
    }
};

</script>

</body>
</html>
