<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Showcase</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

    <!-- Header -->
    <header class="bg-purple-700 text-white p-6">
        <h1 class="text-3xl font-bold text-center">🛍️ Smart Store</h1>
    </header>

    <!-- Products -->
    <section class="p-6">

        <h2 class="text-2xl font-bold text-center text-purple-700 mb-6">
            TrendCart
        </h2>

        <div class="flex flex-col md:flex-row md:flex-wrap gap-6 justify-center">

            <!-- Product 1 -->
            <div class="bg-white w-full md:w-[30%] p-4 rounded-xl shadow
                        hover:shadow-2xl hover:-translate-y-2">

                <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30"
                     class="w-full h-48 object-cover rounded-lg">

                <h3 class="text-xl font-bold mt-4">Smart Watch</h3>
                <p class="text-gray-600">Modern smart watch</p>
                <p class="text-purple-700 font-bold text-lg mt-2">₹1999</p>

                <button class="bg-purple-600 text-white px-5 py-2 mt-3 rounded-lg
                               hover:bg-purple-800
                               focus:outline-none focus:ring-4 focus:ring-purple-300
                               active:bg-purple-900">
                    Buy Now
                </button>
            </div>

            <!-- Product 2 -->
            <div class="bg-white w-full md:w-[30%] p-4 rounded-xl shadow
                        hover:shadow-2xl hover:-translate-y-2">

                <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e"
                     class="w-full h-48 object-cover rounded-lg">

                <h3 class="text-xl font-bold mt-4">Headphones</h3>
                <p class="text-gray-600">Wireless headphones</p>
                <p class="text-purple-700 font-bold text-lg mt-2">₹1499</p>

                <button class="bg-purple-600 text-white px-5 py-2 mt-3 rounded-lg
                               hover:bg-purple-800
                               focus:outline-none focus:ring-4 focus:ring-purple-300
                               active:bg-purple-900">
                    Buy Now
                </button>
            </div>

            <!-- Product 3 -->
            <div class="bg-white w-full md:w-[30%] p-4 rounded-xl shadow
                        hover:shadow-2xl hover:-translate-y-2">

                <img src="https://images.unsplash.com/photo-1553062407-98eeb64c6a62"
                     class="w-full h-48 object-cover rounded-lg">

                <h3 class="text-xl font-bold mt-4">Backpack</h3>
                <p class="text-gray-600">Stylish travel backpack</p>
                <p class="text-purple-700 font-bold text-lg mt-2">₹999</p>

                <button class="bg-purple-600 text-white px-5 py-2 mt-3 rounded-lg
                               hover:bg-purple-800
                               focus:outline-none focus:ring-4 focus:ring-purple-300
                               active:bg-purple-900">
                    Buy Now
                </button>
            </div>

            <!-- Product 4 -->
            <div class="bg-white w-full md:w-[30%] p-4 rounded-xl shadow
                        hover:shadow-2xl hover:-translate-y-2">

                <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff"
                     class="w-full h-48 object-cover rounded-lg">

                <h3 class="text-xl font-bold mt-4">Sneakers</h3>
                <p class="text-gray-600">Comfortable sports shoes</p>
                <p class="text-purple-700 font-bold text-lg mt-2">₹2499</p>

                <button class="bg-purple-600 text-white px-5 py-2 mt-3 rounded-lg
                               hover:bg-purple-800
                               focus:outline-none focus:ring-4 focus:ring-purple-300
                               active:bg-purple-900">
                    Buy Now
                </button>
            </div>

            <!-- Product 5 -->
            <div class="bg-white w-full md:w-[30%] p-4 rounded-xl shadow
                        hover:shadow-2xl hover:-translate-y-2">

                <img src="https://images.unsplash.com/photo-1496181133206-80ce9b88a853"
                     class="w-full h-48 object-cover rounded-lg">

                <h3 class="text-xl font-bold mt-4">Laptop</h3>
                <p class="text-gray-600">Fast and powerful laptop</p>
                <p class="text-purple-700 font-bold text-lg mt-2">₹45999</p>

                <button class="bg-purple-600 text-white px-5 py-2 mt-3 rounded-lg
                               hover:bg-purple-800
                               focus:outline-none focus:ring-4 focus:ring-purple-300
                               active:bg-purple-900">
                    Buy Now
                </button>
            </div>

            <!-- Product 6 -->
            <div class="bg-white w-full md:w-[30%] p-4 rounded-xl shadow
                        hover:shadow-2xl hover:-translate-y-2">

                <img src="https://images.unsplash.com/photo-1516035069371-29a1b244cc32"
                     class="w-full h-48 object-cover rounded-lg">

                <h3 class="text-xl font-bold mt-4">Camera</h3>
                <p class="text-gray-600">Capture beautiful moments</p>
                <p class="text-purple-700 font-bold text-lg mt-2">₹29999</p>

                <button class="bg-purple-600 text-white px-5 py-2 mt-3 rounded-lg
                               hover:bg-purple-800
                               focus:outline-none focus:ring-4 focus:ring-purple-300
                               active:bg-purple-900">
                    Buy Now
                </button>
            </div>

        </div>
    </section>

</body>
</html>
