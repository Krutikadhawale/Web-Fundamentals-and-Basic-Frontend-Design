
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Result Calculator</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-r from-blue-400 via-purple-400 to-pink-400
             min-h-screen flex items-center justify-center p-4">

    <!-- Main Box -->
    <div class="bg-white w-full max-w-md p-8 rounded-3xl shadow-2xl">

        <!-- Heading -->
        <div class="text-center mb-6">

            <div class="text-5xl mb-3">
                🎓
            </div>

            <h1 class="text-3xl font-bold text-purple-700">
                Student Result
            </h1>

            <p class="text-gray-500">
                Practical Marks Calculator
            </p>

        </div>


        <!-- Practical 1 -->
        <div class="mb-4">

            <label class="font-bold text-gray-700">
                📘 Practical 1
            </label>

            <input
                type="number"
                id="p1"
                placeholder="Enter marks out of 100"
                class="w-full p-3 mt-2 border rounded-xl
                       focus:outline-none focus:ring-2
                       focus:ring-blue-400">

        </div>


        <!-- Practical 2 -->
        <div class="mb-4">

            <label class="font-bold text-gray-700">
                📗 Practical 2
            </label>

            <input
                type="number"
                id="p2"
                placeholder="Enter marks out of 100"
                class="w-full p-3 mt-2 border rounded-xl
                       focus:outline-none focus:ring-2
                       focus:ring-purple-400">

        </div>


        <!-- Practical 3 -->
        <div class="mb-5">

            <label class="font-bold text-gray-700">
                📕 Practical 3
            </label>

            <input
                type="number"
                id="p3"
                placeholder="Enter marks out of 100"
                class="w-full p-3 mt-2 border rounded-xl
                       focus:outline-none focus:ring-2
                       focus:ring-pink-400">

        </div>


        <!-- Button -->
        <button
            onclick="calculate()"
            class="w-full bg-gradient-to-r from-blue-600
                   to-purple-600 text-white p-3 rounded-xl
                   font-bold text-lg hover:scale-105
                   transition">

            ✨ Calculate Result

        </button>


        <!-- Result -->
        <div class="mt-6 bg-gradient-to-r from-purple-100
                    to-pink-100 p-5 rounded-2xl">

            <h2 class="text-xl font-bold text-center
                       text-purple-700 mb-4">

                🏆 Your Result

            </h2>


            <!-- Total -->
            <div class="flex justify-between bg-white
                        p-3 rounded-lg mb-3">

                <span>Total Marks</span>

                <span id="total"
                      class="font-bold text-blue-600">
                    0 / 300
                </span>

            </div>


            <!-- Percentage -->
            <div class="flex justify-between bg-white
                        p-3 rounded-lg mb-3">

                <span>Percentage</span>

                <span id="percentage"
                      class="font-bold text-purple-600">
                    0%
                </span>

            </div>


            <!-- Grade -->
            <div class="flex justify-between bg-white
                        p-3 rounded-lg">

                <span>Grade</span>

                <span id="grade"
                      class="font-bold text-pink-600">
                    -
                </span>

            </div>

        </div>


        <p class="text-center text-gray-400 text-sm mt-5">
            💡 Enter marks and calculate your result
        </p>

    </div>


    <!-- JavaScript -->
    <script>

        function calculate() {

            let p1 = Number(document.getElementById("p1").value);
            let p2 = Number(document.getElementById("p2").value);
            let p3 = Number(document.getElementById("p3").value);

            let total = p1 + p2 + p3;

            let percentage = (total / 300) * 100;

            let grade;

            if (percentage >= 90) {
                grade = "A+ 🌟";
            }
            else if (percentage >= 80) {
                grade = "A 👍";
            }
            else if (percentage >= 70) {
                grade = "B 😊";
            }
            else if (percentage >= 60) {
                grade = "C 🙂";
            }
            else if (percentage >= 50) {
                grade = "D ✔️";
            }
            else {
                grade = "F ❌";
            }

            document.getElementById("total").innerHTML =
                total + " / 300";

            document.getElementById("percentage").innerHTML =
                percentage.toFixed(2) + "%";

            document.getElementById("grade").innerHTML =
                grade;

        }

    </script>

</body>

</html>
