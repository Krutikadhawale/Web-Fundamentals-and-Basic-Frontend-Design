<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Result Calculator</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-blue-200 via-purple-200 to-pink-200 
             min-h-screen flex items-center justify-center">

    <div class="bg-white w-full max-w-lg p-8 rounded-2xl shadow-xl">

        <!-- Header -->
        <div class="text-center mb-6">

            <img
                src="https://cdn-icons-png.flaticon.com/512/2995/2995620.png"
                class="w-20 mx-auto mb-3">

            <h1 class="text-3xl font-bold text-blue-700">
                Student Result
            </h1>

            <p class="text-gray-500">
                Practical Marks Calculator
            </p>

        </div>


        <!-- Practical 1 -->
        <div class="mb-4">

            <label class="block font-semibold text-gray-700 mb-1">
                Practical 1
            </label>

            <input
                type="number"
                id="p1"
                placeholder="Enter marks out of 100"
                class="w-full p-3 border border-gray-300 rounded-lg
                       focus:outline-none focus:ring-2 focus:ring-blue-400">

        </div>


        <!-- Practical 2 -->
        <div class="mb-4">

            <label class="block font-semibold text-gray-700 mb-1">
                Practical 2
            </label>

            <input
                type="number"
                id="p2"
                placeholder="Enter marks out of 100"
                class="w-full p-3 border border-gray-300 rounded-lg
                       focus:outline-none focus:ring-2 focus:ring-blue-400">

        </div>


        <!-- Practical 3 -->
        <div class="mb-6">

            <label class="block font-semibold text-gray-700 mb-1">
                Practical 3
            </label>

            <input
                type="number"
                id="p3"
                placeholder="Enter marks out of 100"
                class="w-full p-3 border border-gray-300 rounded-lg
                       focus:outline-none focus:ring-2 focus:ring-blue-400">

        </div>


        <!-- Calculate Button -->
        <button
            onclick="calculate()"
            class="w-full bg-blue-600 text-white py-3 rounded-lg
                   font-bold hover:bg-blue-700">

            Calculate Result

        </button>


        <!-- Result -->
        <div class="mt-6 bg-gray-50 border rounded-xl p-5">

            <h2 class="text-xl font-bold text-center text-purple-700 mb-4">
                Result
            </h2>

            <!-- Total Marks -->
            <div class="flex justify-between border-b py-2">
                <span>Total Marks</span>
                <span id="total" class="font-bold">0 / 300</span>
            </div>

            <!-- Percentage -->
            <div class="flex justify-between border-b py-2">
                <span>Percentage</span>
                <span id="percentage" class="font-bold">0%</span>
            </div>

            <!-- Grade -->
            <div class="flex justify-between py-2">
                <span>Grade</span>
                <span id="grade" class="font-bold text-purple-600">-</span>
            </div>

        </div>

    </div>


    <!-- JavaScript -->
    <script>

        function calculate() {

            // Get marks from input fields
            let p1 = Number(document.getElementById("p1").value);
            let p2 = Number(document.getElementById("p2").value);
            let p3 = Number(document.getElementById("p3").value);

            // Calculate total
            let total = p1 + p2 + p3;

            // Calculate percentage
            let percentage = (total / 300) * 100;

            // Calculate grade
            let grade;

            if (percentage >= 90) {
                grade = "A+ (Excellent)";
            }
            else if (percentage >= 80) {
                grade = "A (Very Good)";
            }
            else if (percentage >= 70) {
                grade = "B (Good)";
            }
            else if (percentage >= 60) {
                grade = "C (Fair)";
            }
            else if (percentage >= 50) {
                grade = "D (Pass)";
            }
            else {
                grade = "F (Fail)";
            }

            // Display result
            document.getElementById("total").innerHTML =
                total + " / 300";

            document.getElementById("percentage").innerHTML =
                percentage.toFixed(2) + "%";

            document.getElementById("grade").innerHTML =
                grade;
        }

    </script>

</body>
</html>
